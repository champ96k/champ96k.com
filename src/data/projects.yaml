- id: triple-ledger-x
  title: Trip Ledger
  description: >-
    A simple tracker for office trip reimbursements, so you can log expenses
    and get your money back without confusion.
  date: 2025-12-20
  type: Tool
  tags: [TypeScript, Web]
  url: https://tripledger.labs.champ96k.com/
  github: https://github.com/champ96k/office-trip-reimbursement
  status: Live
  image: "/project/Trip Ledger.png"
  overview: >-
    Settling office trip expenses used to mean paper bills, a spreadsheet, and
    a lot of back-and-forth before anyone got reimbursed. Trip Ledger tracks who
    paid for what across a trip and works out the splits, so the maths is done
    once and everyone can see it. I built it to replace the spreadsheet ritual
    with something the whole team can actually use.

- id: focusmatrix
  title: FocusMatrix
  description: >-
    A focus and time-blocking tool that plans your day around what matters, so
    you actually finish what you started.
  date: 2025-10-08
  type: Tool
  tags: [TypeScript, Web]
  url: https://focusmatrix.labs.champ96k.com/
  github: https://github.com/champ96k/FocusMatrix
  status: Live
  image: "/project/Focus Matrix.png"
  overview: >-
    To-do lists grow; priorities don't. Focus Matrix sorts tasks into the
    Eisenhower grid — urgent, important, and everything in between — so it is
    obvious what to do next and what can wait. I built it for the moment when a
    long list stops being useful and you just need to decide what actually
    matters today.

- id: quantadb
  title: QuantaDB
  description: >-
    A high-performance NoSQL database built entirely in Dart that lets apps
    store and query data locally, right on the device.
  date: 2025-05-17
  type: Library
  tags: [Dart, Flutter, Database]
  url: https://quantadb.netlify.app/
  github: https://github.com/champ96k/quanta_db
  status: Open Source
  technologies: [Dart, Dart FFI]
  image: /project/QuantaDB.png
  overview: >-
    Flutter apps often need a fast local database, but the options either add a
    lot of overhead or push you toward a remote service. QuantaDB is a small
    embedded database written in Dart and reached through Dart FFI, so queries
    stay local and quick. It started as a way to understand how database engines
    work under the hood and became a library I could reuse in my own apps.

- id: ai-code-review
  title: AI Code Review Action
  description: >-
    An AI-powered GitHub action that reviews your pull requests and flags
    issues automatically before code goes live.
  date: 2025-03-03
  type: Tool
  tags: [GitHub Actions, AI, Python]
  github: https://github.com/champ96k/ai-code-review-action
  status: Open Source
  technologies: [Python, GitHub Actions]
  image: "/project/AI Code Review.png"
  overview: >-
    Code review time is scarce, and a lot of it goes to things a machine can
    catch first. AI Code Review Action runs in CI and leaves a first-pass review
    on pull requests — surface-level issues, obvious risks, and questions worth
    a human look. It is meant to give reviewers a head start, not replace them.

