# All projects Tushar personally built, newest first is automatic (sorted by `date`).
# Add a new project by appending an entry; the sites sorts everything itself.
#
# Fields (all optional except `id`, `title`, `date`):
#   id, title, description, date (YYYY-MM-DD), type, tags[], image, url,
#   github, status, technologies[], overview, what_i_built[], links[]
# The detail page only renders the sections that are present.
#
# `date` is the date the project was created (its repo's creation date), so the
# timeline reflects when the work started.

- id: drawmesh
  title: DrawMesh
  description: >-
    A local-first whiteboard that feels like Excalidraw but lives entirely in
    your browser, with offline drawing and instant autosave.
  date: 2026-10-19
  type: Website
  tags: [TypeScript, Web, Tool]
  url: https://drawmesh.netlify.app/
  github: https://github.com/champ96k/drawmesh
  status: Open Source
  technologies: [TypeScript, React, Excalidraw]
  overview: >-
    I built DrawMesh for fun, mostly to understand how excalidraw.com works by
    reverse engineering it piece by piece. It is a local-first whiteboard: your
    drawings are saved in IndexedDB, the app installs as a PWA, and it keeps
    working with no network. A command palette and debounced autosave make it
    feel like a real tool rather than a demo, and building it taught me how much
    coordination a simple canvas actually needs.

- id: posetrace
  title: PoseTrace
  description: >-
    A camera overlay that shows a reference pose on screen, so you can line up
    a shot instead of guessing.
  date: 2026-10-18
  type: Website
  tags: [Web, Tool, Photography]
  url: https://posetrace.netlify.app
  status: Live
  overview: >-
    I take a lot of photos and the hardest part is often getting the pose right
    when there is nobody around to demonstrate it. PoseTrace overlays a ghost
    reference figure on your camera feed, with guides for Street, Summer, and
    Film & Minimal styles, so you can match the composition live. You can save
    the references you like and come back to them, which makes it a small
    personal lookbook as much as a shooting aid.

- id: project-1947
  title: Project 1947
  description: >-
    A digital library of Indian newspapers from 15 August 1947, the day India
    gained its independence, so you can read history exactly as it was
    reported.
  date: 2026-08-14
  type: Website
  tags: [TypeScript, Web, Archive]
  url: https://15aug1947.netlify.app/
  github: https://github.com/champ96k/15-agu-1947-archive
  status: Active
  image: /project/15Aug1947.png
  overview: >-
    I built this because reading about Independence Day in a textbook never
    felt like the real thing — I wanted to see the actual pages people opened
    that morning. It collects front pages and clippings from 15 August 1947 in
    one browsable archive, so history lovers can read the news exactly as it was
    printed. The goal was simple: make a day that shaped the country feel
    immediate instead of like a distant chapter.

