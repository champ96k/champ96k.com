  description: >-
    A macOS menu bar app that shows your AI usage, cost and remaining credits
    at a glance, so you never have to open the provider dashboard.
  date: 2026-07-12
  type: App
  tags: [macOS, AI, Tool]
  github: https://github.com/champ96k/Tokenbar
  status: Active
  technologies: [Swift, macOS]
  image: /project/TokenBar.png
